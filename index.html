<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

h1{font-size:20px;margin:6px 0 10px}

select{font:inherit;padding:8px 10px;border-radius:8px;background:var(--card);color:var(--tx);border:1px solid var(--line);min-height:40px}

.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin:2px 0 4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}

.bars .f{height:100%;background:var(--s1);border-radius:0 4px 4px 0}

.over{color:var(--s2)}
textarea{width:100%;min-height:90px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;font:12px monospace}

.tgrid{display:grid;grid-template-areas:"t" "c" "p" "f"}
.gt{grid-area:t}.gc{grid-area:c}.gp{grid-area:p}.gf{grid-area:f}
.tgrid{grid-template-columns:minmax(0,1fr)}.gt,.gc,.gp,.gf{min-width:0}
.tagrow{margin:8px 0}.tagrow .chips{margin-top:6px}

.bars.wide .r{grid-template-columns:120px 1fr 90px}
@media (max-width:767px){

.praise{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);z-index:50;max-width:min(92vw,580px);background:linear-gradient(135deg,#256abf,#7a3fd0);color:#fff;border-radius:18px;padding:14px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,1.4,.4,1);cursor:pointer}

input[type=email],input[type=password]{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:2px 0 8px;min-height:44px}

.dcol{display:flex;flex-direction:column;gap:8px;padding:6px;border-radius:16px;border:2px solid transparent}
.dcol.cur{border-color:var(--s1)}

button.dbtn:disabled{cursor:default}
@media (min-width:768px){.dbtn{min-height:96px;font-size:26px}.dh{font-size:14px}}
</style>

function makeBoard(hl){

  const seg=(r0,r1,i)=>{const a0=i*18-9,a1=i*18+9,p=P(r1,a0),q=P(r1,a1),s=P(r0,a1),u=P(r0,a0);return `M${p[0]} ${p[1]}A${r1} ${r1} 0 0 1 ${q[0]} ${q[1]}L${s[0]} ${s[1]}A${r0} ${r0} 0 0 0 ${u[0]} ${u[1]}Z`;};

    d[ev?'red':'green']+=seg(95.3,100,i)+seg(58.2,62.9,i);

// šipka je řetězec "fáze:double:zásah", fáze = a | b | fa | fb
function replay(darts){
  const mk=()=>({idx:0,cur:0,runs:[],n:0,hits:0,dn:0,pend:false,fb:null,fbN:0,fbT:0,fbRuns:0,att:0,fatt:0,hd:[]});
  const mf=()=>({lvl:0,vd:0,vh:0,max:0,turns:0,done:0,n:0,hits:0,lost:false,flaw:0});
  const R={a:mk(),b:mk(),fa:mf(),fb:mf()};
  const nb=()=>({i:0,score:27,peak:27,reached:0,turns:0,over:false,done:false,zeros:0,neg:false});
  const bgames=[];let bc=nb();const bby={};
  const no=()=>({i:0,n:0,pro:false,vd:0,peak:0,resets:0,done:false,fails:{}});const og=[];let oc=no();const oby={};
  const rr={set:[],idx:0,n:0,active:false,sets:[],by:{},att:0,curHd:[],setHd:[]};const cc=[],zz=[],pp={n:0,h:0,by:{}};let cl=CH.indexOf(121);const tt=[];let tcur=null;
  for(const d of darts){
    const [p,t,h,x,y]=d.split(':');
    if(p==='k'||p==='kn'){
      const tt=+t,neg=p==='kn';
      if(tt===0){if(bc.turns>0)bgames.push(bc);bc=nb();continue;}
      if(bc.over||bc.done) continue;
      const n=+h,v=2*tt;
      bc.score+=n>0?v*n:-v;bc.turns++;if(n===0)bc.zeros++;
      const o=bby[tt]||(bby[tt]={n:0,h:0});o.n+=3;o.h+=n;
      bc.neg=neg;
      if(bc.score<0&&!neg)bc.over=true;
      else{bc.peak=Math.max(bc.peak,bc.score);bc.i++;bc.reached=bc.i;if(bc.i>=BOB.length)bc.done=true;}
      continue;
    }
    if(p==='o'||p==='ot'){
      const tg=+t;
      if(tg===0){if(oc.n>0)og.push(oc);oc=no();continue;}
      if(oc.done){og.push(oc);oc=no();}
      oc.pro=p==='ot';oc.n++;oc.vd++;
      const q=oby[tg]||(oby[tg]={n:0,h:0});q.n++;
      if(h==='1'){q.h++;oc.i++;oc.peak=Math.max(oc.peak,oc.i);oc.vd=0;if(oc.i>=BOB.length)oc.done=true;}
      else if(oc.pro&&oc.vd>=3){oc.fails[tg]=(oc.fails[tg]||0)+1;oc.resets++;oc.i=0;oc.vd=0;}
      continue;
    }
    if(p==='ax'||p==='ay'){
      const ra=R.a;ra.n++;ra.cur++;ra.pend=false;
      if(p==='ax'){ra.fb='y';ra.fbT=+t;ra.fbN++;ra.att=0;ra.fatt=0;}
      else{ra.dn++;ra.fatt++;if(h==='1'){ra.hd.push({t:+t,d:ra.fatt});ra.fatt=0;ra.hits++;ra.runs.push(ra.cur);ra.fbRuns++;ra.idx=0;ra.cur=0;ra.fb=null;}}
      continue;
    }
    if(p==='rd'){rr.set=t.split('-').map(Number);rr.idx=0;rr.n=0;rr.att=0;rr.curHd=[];rr.active=true;continue;}
    if(p==='r'){if(!rr.active)continue;const tg=+t;const o=rr.by[tg]||(rr.by[tg]={n:0,h:0});o.n++;rr.n++;rr.att++;if(h==='1'){o.h++;rr.curHd.push({t:tg,d:rr.att});rr.att=0;rr.idx++;if(rr.idx>=rr.set.length){rr.sets.push(rr.n);rr.setHd.push(rr.curHd);rr.active=false;}}continue;}
    if(p==='c'){cc.push({d:+t,s:h==='1',lvl:CH[cl],dd:x===undefined?null:+x});cl=Math.max(0,Math.min(CH.length-1,cl+(h==='1'?1:-1)));continue;}
    if(p==='z'){zz.push({st:+t,s:h==='1',d:+x,dd:y===undefined?null:+y});continue;}
    if(p==='p'){pp.n++;if(h==='1')pp.h++;const o=pp.by[t]||(pp.by[t]={n:0,h:0});o.n++;if(h==='1')o.h++;continue;}
    if(/^t\d*$/.test(p)){const N=p==='t'?30:+p.slice(1),tg=+t;if(!tcur||tcur.n>=tcur.N||tcur.t!==tg||tcur.N!==N){tcur={t:tg,n:0,h:0,N};tt.push(tcur);}tcur.n++;if(h==='1')tcur.h++;continue;}
    const hit=h==='1'; const r=R[p]; if(!r) continue;
    r.n++; if(hit) r.hits++;
    if(p==='a'||p==='b'){
      r.cur++;r.dn++;r.att++;if(hit){r.hd.push({t:+t,d:r.att});r.att=0;}if(p==='a')r.pend=(t==='5'&&!hit);
      if(hit){r.idx++; if(r.idx>=LADDERS[p].length){r.runs.push(r.cur);r.idx=0;r.cur=0;}}
    }else{
      const L=LADDERS[p[1]];
      r.vd++;
      if(hit){r.vh++;r.lvl++;r.max=Math.max(r.max,r.lvl);
        if(r.lvl>=L.length){r.done++;if(!r.lost)r.flaw++;r.lost=false;r.lvl=0;r.turns++;r.vd=0;r.vh=0;}}
      if(r.vd>=3){r.turns++;if(!r.vh){if(r.lvl>0)r.lost=true;r.lvl=Math.max(0,r.lvl-1);}r.vd=0;r.vh=0;}
    }
  }
  R.o={cur:oc,games:oc.n>0?[...og,oc]:og,by:oby};
  R.k={cur:bc,games:bc.turns>0?[...bgames,bc]:bgames,by:bby};
  R.r=rr;R.c=cc;R.cLvl=CH[cl];R.z=zz;R.p=pp;R.t={tests:tt,cur:tcur};
  return R;
}
function summarize(darts){
  const by={};let n=0,h=0,mn=0;const dir={u:0,d:0,l:0,r:0},miss=[];
  for(const d of darts){
    const a=d.split(':'),p=a[0],t=a[1],x=a[2]; if(p==='k'||p==='kn'||p==='rd'||p==='c'||p==='z'||p==='ax'||((p==='o'||p==='ot')&&t==='0')) continue; n++; if(x==='1')h++;
    if(x==='0'){mn++;const o=missOff(+t,a[3]);if(o){dir[o.d]++;miss.push(o);}}
    const o=by[t]||(by[t]={n:0,h:0}); o.n++; if(x==='1')o.h++;
  }
  const R=replay(darts);
  for(const t in R.k.by){const o=by[t]||(by[t]={n:0,h:0});o.n+=R.k.by[t].n;o.h+=R.k.by[t].h;n+=R.k.by[t].n;h+=R.k.by[t].h;}
  const OG=R.o.games,oFails={};OG.forEach(g=>{for(const k in g.fails)oFails[k]=(oFails[k]||0)+g.fails[k];});
  const G=R.k.games,Gs=G.filter(g=>!g.neg);
  const fdn=[...R.a.hd,...R.b.hd,...R.r.setHd.flat()];
  const cOk=R.c.filter(x=>x.s),dds=R.c.map(x=>x.dd).filter(v=>v!=null),zdd=R.z.map(x=>x.dd).filter(v=>v!=null);
  let tn=0,th=0;R.t.tests.forEach(q=>{tn+=q.n;th+=q.h;});
  return {n,h,by,mn,dir,miss,tn,th,fd:{n:fdn.length+R.p.n,h:fdn.filter(x=>x.d===1).length+R.p.h},pn:R.p.n,ph:R.p.h,
    zTries:R.z.length,zSucc:R.z.filter(x=>x.s).length,zDarts:R.z.filter(x=>x.s).map(x=>x.d),zDD:zdd,cDD:dds,cMax:cOk.length?Math.max(...cOk.map(x=>x.lvl)):null,
    runsA:R.a.runs,runsB:R.b.runs,bobGames:G.length,fbRunsA:R.a.fbRuns,hdA:R.a.hd,hdB:R.b.hd,randDetail:R.r.setHd,
    bobReached:Gs.length?Math.max(...Gs.map(g=>g.reached)):null,
    bobPeak:Gs.length?Math.max(...Gs.map(g=>g.peak)):null,bobNeg:G.filter(g=>g.neg).map(g=>({f:g.score,r:g.reached,p:g.peak})),bobBy:R.k.by,randSets:R.r.sets,randBy:R.r.by,cTries:R.c.length,cSucc:cOk.length,cDarts:cOk.map(x=>x.d),tests:R.t.tests.filter(x=>x.n>=x.N),
    oFree:OG.filter(g=>!g.pro&&g.done).map(g=>g.n),oPro:OG.filter(g=>g.pro).map(g=>({n:g.n,peak:g.peak,resets:g.resets,done:g.done})),oFails,oN:OG.length,
    finA:R.fa.n?R.fa.max/LADDERS.a.length*100:null,
    finB:R.fb.n?R.fb.max/LADDERS.b.length*100:null,R};
}

const Store={mode:'local',col:null,sessions:[],fallback:false,cloud:false,
  async init(){
    let ok=false;
    try{
      if(typeof claude!=='undefined'&&claude.use){
        const db=await claude.use('db'); const user=await claude.use('user');
        const uid=user?await user.id():null;
        if(db&&uid){
          this.col=db.collection('data/users/'+uid);
          const snap=await Promise.race([this.col.orderBy('ts','asc').get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),10000))]);
          this.sessions=snap.docs.map(d=>({id:d.id,...d.data()}));
          this.mode='db'; ok=true;
        }
      }
    }catch(e){ok=false}
    const loc=lsGet(LS_S,[]).map(x=>({...x,loc:true}));
    if(ok){loc.forEach(x=>{if(!this.sessions.some(y=>y.id===x.id))this.sessions.push(x);});}
    else{this.mode='local';this.sessions=loc;}
  },
  localAdd(s){lsSet(LS_S,[...lsGet(LS_S,[]),{id:s.id,...recOf(s)}]);s.loc=true;},
  setCloud(arr){this.cloud=true;this.fallback=false;const loc=lsGet(LS_S,[]).filter(x=>!arr.some(y=>y.id===x.id)).map(x=>({...x,loc:true}));this.sessions=[...arr,...loc];},
  leaveCloud(){this.cloud=false;this.fallback=false;this.mode='local';this.sessions=lsGet(LS_S,[]).map(x=>({...x,loc:true}));},
  pendingLocal(){return this.cloud?this.sessions.filter(x=>x.loc).length:0;},
  async uploadLocal(){
    for(const s of this.sessions.filter(x=>x.loc)){
      await Cloud.ad.save({id:s.id,...recOf(s)});
      lsSet(LS_S,lsGet(LS_S,[]).filter(x=>x.id!==s.id));s.loc=false;
    }
  },
  async save(s){
    s.id='s'+s.ts;this.fallback=false;
    if(this.cloud){
      try{await Cloud.ad.save({id:s.id,...recOf(s)});}
      catch(e){this.fallback=true;this.localAdd(s);}
    }else if(this.mode==='db'){
      try{await this.col.doc(s.id).set(recOf(s));}
      catch(e){this.fallback=true;this.localAdd(s);}
    }else{this.localAdd(s);}
    this.sessions.push(s);
  },
  async remove(id){
    const s=this.sessions.find(x=>x.id===id);
    if(this.cloud&&!(s&&s.loc)){await Cloud.ad.remove(id);}
    else if(this.mode==='db'&&!(s&&s.loc)){await this.col.doc(id).delete();}
    else lsSet(LS_S,lsGet(LS_S,[]).filter(x=>x.id!==id));
    this.sessions=this.sessions.filter(x=>x.id!==id);
  }
};

const VW=640,VH=240,ML=58,MR=18,MT=14,MB=34;
function lineChart(id,labels,series,yMin,yMax,yFmt){
  const n=labels.length;
  const xs=labels.map((_,i)=>n===1?ML+(VW-ML-MR)/2:ML+i*(VW-ML-MR)/(n-1));
  const Y=v=>MT+(1-(v-yMin)/(yMax-yMin))*(VH-MT-MB);
  let g='';
  for(let i=0;i<=4;i++){const v=yMin+(yMax-yMin)*i/4,y=Y(v);
    g+=`<line x1="${ML}" x2="${VW-MR}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${ML-6}" y="${y+4}" text-anchor="end" font-size="17" fill="var(--tx3)">${yFmt(v)}</text>`;}
  const k=Math.ceil(n/8);
  labels.forEach((l,i)=>{if(i%k===0||i===n-1) g+=`<text x="${xs[i]}" y="${VH-8}" text-anchor="middle" font-size="17" fill="var(--tx3)">${esc(l)}</text>`;});
  let lines='',marks='';
  series.forEach(s=>{
    let seg=[];const flush=()=>{if(seg.length>1) lines+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" points="${seg.join(' ')}"/>`;seg=[];};
    s.vals.forEach((v,i)=>{ if(v==null){flush();return;} seg.push(xs[i]+','+Y(v)); marks+=`<circle cx="${xs[i]}" cy="${Y(v)}" r="4.5" fill="${s.color}" stroke="var(--ring)" stroke-width="2"/>`; });
    flush();
  });
  const leg=series.length>1?`<div class="legend">${series.map(s=>`<span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  after.push(()=>{
    const wrap=document.getElementById(id); if(!wrap) return;
    const svg=wrap.querySelector('svg'),tip=wrap.querySelector('.tip'),cr=svg.querySelector('.cr');
    const move=e=>{
      const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW;
      let bi=0,bd=1e9;xs.forEach((v,i)=>{const d=Math.abs(v-x);if(d<bd){bd=d;bi=i}});
      cr.setAttribute('x1',xs[bi]);cr.setAttribute('x2',xs[bi]);cr.style.display='';
      tip.innerHTML='<b>'+esc(labels[bi])+'</b>'+series.map(s=>`<div><i class="sw" style="background:${s.color}"></i>${esc(s.name)}: ${s.vals[bi]==null?'—':s.fmt(s.vals[bi])}</div>`).join('');
      tip.style.display='block';
      const px=xs[bi]/VW*r.width;tip.style.left=Math.max(0,Math.min(px-tip.offsetWidth/2,r.width-tip.offsetWidth))+'px';
    };
    svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
    svg.addEventListener('pointerleave',()=>{tip.style.display='none';cr.style.display='none'});
  });
  const alt=series.map(s=>s.name+': '+s.vals.map(v=>v==null?'—':s.fmt(v)).join(', ')).join('; ');
  return `${leg}<div class="chart" id="${id}"><svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${esc(alt)}">${g}<line class="cr" y1="${MT}" y2="${VH-MB}" stroke="var(--tx3)" stroke-dasharray="3 3" style="display:none"/>${lines}${marks}</svg><div class="tip"></div></div>`;
}
function domain(vals,pad,lo,hi,step){
  const v=vals.filter(x=>x!=null);if(!v.length) return [lo,hi];
  let a=Math.floor((Math.min(...v)-pad)/step)*step,b=Math.ceil((Math.max(...v)+pad)/step)*step;
  a=Math.max(lo,a);b=Math.min(hi,b);if(b-a<step*2) b=a+step*4;return [a,b];
}

  <b>Zavírání z náhodného čísla:</b> náhodné číslo ve zvoleném rozsahu, 9 šipek na zavření – trénink přípravy na double i samotného doublu.<br>
  <b>Jedna šipka na double:</b> jedna šipka na vylosovaný double, měří se úspěšnost první šipky na double.<br>
  <b>Test šipek:</b> 10, 20, 30 nebo 40 šipek (zvolíte v nastavení) na jeden double, počet zásahů – větší vzorek pro poctivé srovnání. Double si zvolíte sami, tlačítkem „Náhodný double“ ho nechte vylosovat, nebo zapněte losování po každém testu.<br>
  <b>Around the Clock:</b> postupně D1 až D20 a Bull, na další pole se jde po zásahu. Volně se hází do zásahu (méně šipek = lépe), v režimu profi jsou na pole jen 3 šipky a po minutí se vracíte na D1 – ukáže, na kterých doublech padáte.<br>
  <b>Bob's 27:</b> začínáte na 27 bodech, na každý double D1 až Bull házíte 3 šipky – zásah přičte hodnotu doublu, 0 zásahů ji odečte. Končí, když skóre klesne pod nulu; v nastavení lze zvolit, že se hraje dál i do mínusu.<br>
  <b>Tlakový závěr:</b> hraje se jedna z řad (16·8·4·2·1 nebo 20·10·5, přepínač je v bloku, výchozí je 16·8·4·2·1) a začíná se od jejího prvního doublu. V každém kole máte 3 šipky: zásah = postup na další double v řadě a zbylé šipky kola házíte už na něj; kolo bez jediného zásahu = o jeden stupeň zpět (na úplném začátku zůstanete). Počítá se nejvyšší dosažená úroveň a počet dokončených řad.<br>
  <b>14denní plán:</b> předvolba, která za tebe každý den nastaví hry a limity (zhruba 30–35 minut). Dny 1, 7 a 14 jsou měření na stejných doublech, mezi nimi je objem na první šipku a zavírání z čísla, vždy se závěrem pod tlakem. Po uložení tréninku se plán posune na další den; dnem jde i přeskakovat. Podrobnější vysvětlení je přímo u plánu.<br>

}

function weakDouble(){
  const by={};try{allSessions().forEach(x=>{for(const t in x.sum.by){const o=by[t]||(by[t]={n:0,h:0});o.n+=x.sum.by[t].n;o.h+=x.sum.by[t].h;}});}catch(e){}
  let best=null;for(const t in by){const o=by[t];if(o.n>=30&&(!best||o.h/o.n<best.p))best={t:+t,p:o.h/o.n};}
  return best?best.t:16;
}

function canRepeat(id){if(id==='w') return false;if(['a','b','r','f','p'].includes(id)) return !!(run.lim||{})[id];return true;}
function repeatPhase(){
  const id=run.plan[run.phase].id;
  if(id==='a'||id==='b'||id==='r'||id==='f'||id==='p'){run.rep=run.rep||{};run.rep[id]=(run.rep[id]||0)+1;}
  else if(id==='c'){run.cn+=(run.cn0||run.cn);}
  else if(id==='z'){run.zn+=(run.zn0||run.zn);}
  else if(id==='t'){run.tfresh=true;run.tsel=null;run.tcol=null;if(run.tauto)run.tt=randDbl(run.tt);}
  else if(id==='k'){commit(kcode()+':0:0');return;}
  else if(id==='o'){commit(ocode()+':0:0');return;}
  const m=run.plan[run.phase].min;if(m>0){run.phaseStart=run.elapsed;run.extra=(run.extra||0)+m*60000;}
  saveDraft();
}
function limitInfo(){
  const id=run.plan[run.phase].id,N=((run.lim||{})[id]||0)*(1+((run.rep||{})[id]||0));if(!N) return null;
  const R=replay(run.darts);let k;
  if(id==='a'||id==='b') k=Math.floor(R[id].n/3);
  else if(id==='r') k=R.r.sets.length;
  else if(id==='f') k=R.fa.turns+R.fb.turns;
  else if(id==='p') k=R.p.n;
  else return null;
  return {k,N,unit:id==='r'?'pětic':id==='p'?'šipek':'kol',reached:k>=N};
}
function limitHtml(){
  const li=limitInfo();if(!li) return '';
  return li.reached
    ?`<div class="note">✔ Limit splněn (${li.k} z ${li.N} ${li.unit}). Přejděte na další hru tlačítkem „Další fáze“, nebo můžete házet dál.</div>`
    :`<div class="muted" style="margin:0 0 8px">Limit: ${li.k} z ${li.N} ${li.unit}</div>`;
}

function pads(a='hit',b='miss',la='✓ Double',lb='✗ Mimo'){return `<div class="pads"><button class="b" data-act="${a}">${la}</button><button class="b miss" data-act="${b}">${lb}</button></div>`;}
function updTimers(){
  if(!run||run.timed===false) return;
  const free=run.plan[run.phase].min===0;
  const tot=planMin(run.plan)*60000+(run.extra||0)-run.elapsed,ph=free?1:run.plan[run.phase].min*60000-(run.elapsed-run.phaseStart);
  const a=$('#tTot'),b=$('#tPh'),d=$('#done'),nb=$('#nextBtn');
  if(a) a.textContent=fT(tot);
  if(b){b.textContent=free?'bez času':fT(ph);b.classList.toggle('over',!free&&ph<=0);}
  if(d) d.style.display=tot<=0?'block':'none';
  if(nb){nb.classList.toggle('pulse',ph<=0||!!(limitInfo()||{}).reached);}
}
// čistý čas tréninku: běží, dokud je aplikace na obrazovce; po 5 min bez zadání se zastaví (pauza, odchod od terče)
const IDLE_MS=5*60000;let actLast=Date.now(),actTick=0;
setInterval(()=>{const now=Date.now(),dt=now-actLast;actLast=now;if(!run||run.paused||document.hidden||dt>5000)return;if(now-(run.lastIn||0)<IDLE_MS)run.act=(run.act||0)+dt;const e=$('#tAct');if(e)e.textContent=fClock(run.act);if(++actTick%15===0)saveDraft();},1000);
setInterval(()=>{if(!run||run.timed===false) return;const now=performance.now();if(run.running&&run.plan[run.phase].min>0) run.elapsed+=now-run.last;run.last=now;updTimers();},250);

async function finish(){
  if(!run.darts.length){run=null;lsDel(LS_D);render();return;}
  const s={ts:run.startedAt,durMs:Math.round(run.act||0),darts:run.darts.slice()};
  if(run.p14day&&run.p14id)s.p14={id:run.p14id,day:run.p14day};

  lastSummary=summarize(s.darts);run=null;lsDel(LS_D);sumTitle=(pd?'Uloženo ✔ · den '+pd+' plánu hotový':'Uloženo ✔')+' · '+fHM(s.durMs);clearTimeout(sumT);sumT=setTimeout(()=>{lastSummary=null;if(!run&&tab==='train')render();},15000);render();

}

function allSessions(){return Store.sessions.slice().sort((a,b)=>a.ts-b.ts).map(s=>({s,sum:summarize(s.darts)}));}
function pool(list,t){let n=0,h=0;for(const x of list){if(t==null){n+=x.sum.n;h+=x.sum.h;}else{const o=x.sum.by[t];if(o){n+=o.n;h+=o.h;}}}return{n,h};}
function cmp(recent,prior){
  const a=pool(recent),b=pool(prior);return cmpPool(a,b);
}
function cmpPool(a,b){
  if(a.n<15||b.n<15) return null;
  const p1=a.h/a.n,p0=b.h/b.n,d=(p1-p0)*100,pp=(a.h+b.h)/(a.n+b.n);
  const se=Math.sqrt(pp*(1-pp)*(1/a.n+1/b.n));const z=se?(p1-p0)/se:0;
  return{d,z,p1:p1*100,p0:p0*100,na:a.n,nb:b.n};
}
function distHtml(title,list){
  if(!list.length) return '';
  const cat=[0,0,0,0,0,0];list.forEach(d=>cat[Math.min(d,6)-1]++);const tot=list.length;
  return `<div class="card"><b>${title}</b><div class="bars">${cat.map((c,i)=>`<div class="r"><b>${i===5?'6.+':(i+1)+'.'}</b><div class="t"><div class="f" style="width:${c/tot*100}%"></div></div><span>${c}× · ${fP(c/tot*100)}</span></div>`).join('')}</div><p class="muted" style="margin:6px 0 0">Na kolikátou šipku u daného doublu padl zásah (počítáno od první šipky na tento double). Průměr: ${fN(avg(list))} šipky, zásahů: ${tot}.</p></div>`;
}

    }
    if(OP.length){
      const all=OP.flatMap(x=>x.sum.oPro),pv=OP.map(x=>Math.max(...x.sum.oPro.map(g=>g.peak))),pl=OP.map(x=>fD(x.s.ts)),fl={};
      OP.forEach(x=>{for(const k in x.sum.oFails)fl[k]=(fl[k]||0)+x.sum.oFails[k];});
      const fk=Object.keys(fl).map(Number).sort((a,b)=>fl[b]-fl[a]),mx=fk.length?fl[fk[0]]:1;
      h+=`<div class="tiles"><div class="tile"><span class="lbl">Her profi</span><span class="v">${all.length}</span></div><div class="tile"><span class="lbl">Dokončeno</span><span class="v">${all.filter(g=>g.done).length}</span></div><div class="tile"><span class="lbl">Nejdál</span><span class="v">${Math.max(...all.map(g=>g.peak))}/21</span></div></div>
      <div class="card"><b>Profi: nejdál došlé pole v tréninku</b>${lineChart('c13',pl,[{name:'Pole',color:'var(--s1)',vals:pv,fmt:v=>v+'/21'}],0,21,v=>Math.round(v))}</div>
      ${fk.length?`<div class="card"><b>Na kterém doublu padáte (návrat na D1)</b><div class="bars">${fk.map(t=>`<div class="r"><b>${bl(t)}</b><div class="t"><div class="f" style="width:${fl[t]/mx*100}%"></div></div><span>${fl[t]}×</span></div>`).join('')}</div><p class="muted" style="margin:6px 0 0">Tyhle doubly trénujte zvlášť.</p></div>`:''}`;
    }
  }
  const ZL=L.filter(x=>x.sum.zTries);
  if(ZL.length){
    const tr=ZL.reduce((a,x)=>a+x.sum.zTries,0),su=ZL.reduce((a,x)=>a+x.sum.zSucc,0),dd=ZL.flatMap(x=>x.sum.zDarts),dv=ZL.flatMap(x=>x.sum.zDD);
    const zv=ZL.map(x=>pc(x.sum.zSucc,x.sum.zTries)),zl=ZL.map(x=>fD(x.s.ts)+' ('+x.sum.zSucc+'/'+x.sum.zTries+')');
    h+=`<h2>Zavírání z náhodného čísla</h2><div class="tiles"><div class="tile"><span class="lbl">Pokusů</span><span class="v">${tr}</span></div><div class="tile"><span class="lbl">Zavřeno</span><span class="v">${fP(pc(su,tr))}</span></div><div class="tile"><span class="lbl">Ø šipek při zavření</span><span class="v">${dd.length?fN(avg(dd)):'—'}</span></div><div class="tile"><span class="lbl">Ø šipek na double</span><span class="v">${dv.length?fN(avg(dv)):'—'}</span></div></div>
    <div class="card"><b>Úspěšnost zavření za trénink</b>${lineChart('c10',zl,[{name:'Zavřeno',color:'var(--s1)',vals:zv,fmt:fP}],0,100,v=>Math.round(v)+' %')}</div>`;
  }
  const PL=L.filter(x=>x.sum.pn);
  if(PL.length){
    const pn=PL.reduce((a,x)=>a+x.sum.pn,0),ph=PL.reduce((a,x)=>a+x.sum.ph,0),pv=PL.map(x=>pc(x.sum.ph,x.sum.pn)),pl=PL.map(x=>fD(x.s.ts)+' ('+x.sum.ph+'/'+x.sum.pn+')');
    const [p0,p1]=domain(pv,10,0,100,10);
    h+=`<h2>Jedna šipka na double</h2><div class="tiles"><div class="tile"><span class="lbl">Šipek</span><span class="v">${pn}</span></div><div class="tile"><span class="lbl">Úspěšnost první šipky</span><span class="v">${fP(pc(ph,pn))}</span></div></div>
    <div class="card"><b>Úspěšnost první šipky za trénink</b>${lineChart('c11',pl,[{name:'První šipka',color:'var(--s1)',vals:pv,fmt:fP}],p0,p1,v=>Math.round(v)+' %')}</div>`;
  }
  // test 30
  const TL=L.flatMap(x=>x.sum.tests.map(t=>({ts:x.s.ts,...t})));
  if(TL.length){
    const tl=TL.map(t=>fD(t.ts)+' '+bl(t.t)),tv=TL.map(t=>pc(t.h,t.n));
    const [t0,t1]=domain(tv,10,0,100,10);
    const dbl=[...new Set(TL.map(t=>t.t))];
    h+=`<h2>Test šipek</h2><div class="card"><b>Úspěšnost v jednotlivých testech</b>${lineChart('c8',tl,[{name:'Úspěšnost',color:'var(--s1)',vals:tv,fmt:fP}],t0,t1,v=>Math.round(v)+' %')}<p class="muted" style="margin:4px 0 0">Čím méně šipek v testu, tím větší rozptyl (při 30 šipkách je to zhruba ±15 procentních bodů). Krátké testy berte jen orientačně a porovnávejte průměr více testů stejného doublu.</p></div>
    <div class="card scroll"><table><thead><tr><th>Double</th><th>Testů</th><th>Ø úsp.</th><th>Nejlepší</th><th>Poslední</th></tr></thead><tbody>${dbl.map(t=>{const a=TL.filter(x=>x.t===t),ps=a.map(x=>pc(x.h,x.n)),la=a[a.length-1];return `<tr><td><b>${bl(t)}</b></td><td>${a.length}</td><td>${fP(avg(ps))}</td><td>${fP(Math.max(...ps))}</td><td>${la.h}/${la.n}</td></tr>`}).join('')}</tbody></table></div>`;
  }

  return sw+`<div class="statscols">${pre}${h}</div>`;
}

/* ---------- pohledy: historie ---------- */
function bobTxt(s,short){
  if(!s.bobGames) return '—';
  const a=s.bobReached!=null?(short?s.bobReached+'/21 · '+s.bobPeak+' b.':`nejlépe <b>${s.bobReached}/21</b> cílů, nejvyšší skóre <b>${s.bobPeak}</b>`):'';
  const n=s.bobNeg.length?(short?'mínus: '+Math.max(...s.bobNeg.map(g=>g.f))+' b.':`${a?'; ':''}s mínusem konečné skóre <b>${Math.max(...s.bobNeg.map(g=>g.f))}</b>`):'';
  return a+(a&&n&&short?' · ':'')+n;
}
function extra(s){const p=[];if(s.randSets.length)p.push('Pětice Ø'+fN(avg(s.randSets)));if(s.cTries)p.push('121: '+s.cSucc+'/'+s.cTries);if(s.zTries)p.push('Zavírání: '+s.zSucc+'/'+s.zTries);if(s.pn)p.push('1 šipka: '+s.ph+'/'+s.pn);if(s.oFree.length)p.push('ATC '+Math.min(...s.oFree)+' šipek');if(s.oPro.length)p.push('ATC profi '+Math.max(...s.oPro.map(g=>g.peak))+'/21');s.tests.forEach(t=>p.push(bl(t.t)+' '+t.h+'/'+t.n));return p.join(' · ')||'—';}
function storageNote(){
  if(Store.cloud) return Store.fallback?'jen v tomto prohlížeči (účet teď nedostupný)':'v účtu '+esc((Cloud.user&&Cloud.user.email)||'')+' (synchronizováno mezi zařízeními)';
  if(Store.mode==='db'&&!Store.fallback) return 'na serveru (soukromé jen pro vás)';
  return Cloud.ad?'jen v tomto prohlížeči (po přihlášení se budou ukládat do účtu)':'jen v tomto prohlížeči';
}
function renderStyle(){
  const cur=getTheme();
  const mini=(pv,n)=>`<span style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:${pv.hit};color:${pv.hitTx};font:800 18px/1 system-ui,sans-serif">${n}</span>`;
  return `<h2>Vzhled aplikace</h2><p class="muted" style="margin:0 0 6px">Zvolte styl. Nastavení se pamatuje v tomto zařízení.</p>`+Object.keys(THEMES).map(k=>{
    const t=THEMES[k],pv=t.prev;
    return `<div class="card"><div class="row spread"><div><b>${t.name}</b><div class="muted">${t.desc}</div></div>${k===cur?'<span class="chip cur">Aktivní</span>':`<button class="b sm" data-act="theme" data-v="${k}">Použít</button>`}</div>
    <div style="background:${pv.bg};border:1px solid rgba(128,128,128,.4);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-top:10px"><span style="font:800 40px/1 'Arial Narrow',system-ui,sans-serif;color:${pv.fg}">D20</span><span style="display:flex;gap:6px;margin-left:auto">${[1,2,3].map(n=>mini(pv,n)).join('')}<span style="display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:38px;border-radius:10px;background:${pv.miss};color:${pv.missTx};border:2px solid ${pv.missBd};font:800 14px/1 system-ui,sans-serif">Mimo</span></span></div></div>`;
  }).join('');
}
function renderHist(){
  const L=allSessions().reverse();
  let h='';
  if(histDetail){const x=L.find(y=>y.s.id===histDetail);if(x)h+=summaryCard(x.sum,'Detail tréninku – '+fDL(x.s.ts),'hclose');}
  if(!L.length) h+=`<div class="card">Historie je prázdná.</div>`;
  else h+=`<div class="card scroll"><table><thead><tr><th>Datum</th><th>Čas</th><th>Šipek</th><th>Úsp.</th><th>Ø 20·10·5</th><th>Ø 16·8·4·2·1</th><th>Bob's 27</th><th>Další</th><th>Závěr</th><th></th></tr></thead><tbody>${L.map(({s,sum})=>`<tr><td><button class="b ghost sm" data-act="hdetail" data-id="${s.id}" aria-label="Zobrazit souhrn tréninku">${fDL(s.ts)}${s.p14?' · plán d'+s.p14.day:''}</button></td><td>${s.durMs?fHM(s.durMs):'—'}</td><td>${sum.n}</td><td>${fP(pc(sum.h,sum.n))}</td><td>${sum.runsA.length?fN(avg(sum.runsA))+' ('+sum.runsA.length+'×)':'—'}</td><td>${sum.runsB.length?fN(avg(sum.runsB))+' ('+sum.runsB.length+'×)':'—'}</td><td>${bobTxt(sum,true)}</td><td>${extra(sum)}</td><td>${sum.finA==null?'—':Math.round(sum.finA)+'%'} / ${sum.finB==null?'—':Math.round(sum.finB)+'%'}</td><td>${confirmDel===s.id?`<button class="b sm" data-act="del-yes" data-id="${s.id}">Smazat</button> <button class="b ghost sm" data-act="del-no">Ne</button>`:`<button class="b ghost sm" data-act="del" data-id="${s.id}" aria-label="Smazat trénink">✕</button>`}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<div class="row"><button class="b ghost sm" data-act="export">Zobrazit data (JSON)</button></div>`;
  if(exportText) h+=`<textarea readonly onfocus="this.select()">${esc(exportText)}</textarea>`;
  h+=`<p class="muted">Ukládání: ${storageNote()}.</p>`;
  return h;
}

/* ---------- render + události ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  after.length=0;
  const g=gateState();document.body.classList.toggle('gated',!!g);document.body.classList.toggle('running',!!run&&tab==='train'&&!g);
  {const sb=$('#sub');if(sb)sb.textContent=(run&&tab==='train'&&!g)?run.plan[run.phase].name:'';}
  if(g){$('#main').innerHTML=g==='loading'?'<div class="card muted">Načítám…</div>':'<div class="card muted">Přihlaste se, aby se tréninky ukládaly do vašeho účtu.</div>';renderAcct();return;}
  const m=$('#main');
  m.innerHTML=tab==='train'?(run?renderTrainActive():renderTrainIdle()):tab==='stats'?renderStats():tab==='style'?renderStyle():renderHist();
  after.forEach(f=>f());
  updTimers();
  renderAcct();
}
document.addEventListener('click',async e=>{
  if(run)run.lastIn=Date.now();
  const t=e.target.closest('[data-tab],[data-act]');if(!t) return;
  if(t.dataset.tab){tab=t.dataset.tab;confirmDel=null;lastSummary=null;histDetail=null;render();return;}
  const a=t.dataset.act;
  switch(a){
    case 'reload':location.reload();return;
    case 'acct-open':acct.open=!acct.open;acct.msg='';renderAcct();return;
    case 'acct-close':acct.open=false;renderAcct();return;
    case 'acct-mode':acct.mode=t.dataset.v;acct.msg='';{const em=$('#aem');if(em)acct.email=em.value;}renderAcct();return;
    case 'acct-out':try{await Cloud.ad.signOut();}catch(err){}acct.open=false;renderAcct();return;
    case 'acct-reset':{const em=($('#aem')||{}).value||'';acct.email=em.trim();
      if(!acct.email){acct.msg='Nejdřív zadejte e-mail.';}
      else{try{await Cloud.ad.reset(acct.email);acct.msg='Pokud pro tento e-mail existuje účet, poslali jsme na něj odkaz pro nové heslo.';}catch(err){acct.msg=authMsg(err);}}
      renderAcct();return;}
    case 'acct-upload':try{await Store.uploadLocal();flash('Tréninky z tohoto zařízení jsou v účtu.');}catch(err){flash('Nahrání se nepovedlo, zkuste to později.');}renderAcct();break;
    case 'start':if(!cfg.sel.length){flash('Vyberte alespoň jednu fázi.');return;}startRun({plan:buildPlan(cfg.sel,cfg.cn),cn:cfg.cn,timed:false,fb:cfg.fb||'',lim:Object.assign({},cfg.lim),tn:cfg.tn||30,bneg:!!cfg.bneg,zr:cfg.zr,tt:cfg.p14?cfg.p14.tt:20,p14day:cfg.p14?cfg.p14.day:0,p14id:cfg.p14?cfg.p14.id:0});break;
    case 'sumclose':lastSummary=null;break;
    case 'sumshow':{const L=allSessions();if(L.length){const x=L[L.length-1];lastSummary=x.sum;sumTitle='Poslední trénink – '+fDL(x.s.ts);clearTimeout(sumT);}break;}
    case 'hdetail':histDetail=t.dataset.id;break;
    case 'hclose':histDetail=null;break;
    case 'theme':{const v=t.dataset.v;if(THEMES[v]){try{localStorage.setItem('darts_theme',v);}catch(e){}applyTheme(v);}break;}
    case 'repeat':repeatPhase();break;
    case 'howtoggle':howOpen=!howOpen;break;
    case 'ghow':gHow[t.dataset.id]=!gHow[t.dataset.id];break;
    case 'preset':{if(cfg.p14)cfg.p14last=cfg.p14;cfg.p14=null;const pre=PRESETS[t.dataset.v].sel,same=pre.length===cfg.sel.length&&pre.every(x=>cfg.sel.includes(x));cfg.sel=(t.dataset.v==='all'&&same)?[]:pre.slice();lsSet('darts_cfg',cfg);break;}
    case 'cn':cfg.cn=+t.dataset.v;lsSet('darts_cfg',cfg);break;
    case 'cd':cfg.cd=+t.dataset.v;lsSet('darts_cfg',cfg);break;
    case 'p14on':if(!cfg.p14){const L=cfg.p14last,R=p14Restore();cfg.p14=(L&&(!R||R.id===L.id||L.id>R.id)?L:R)||{id:Date.now(),day:1,done:[]};if(!cfg.p14.id)cfg.p14.id=1;cfg.p14last=null;p14Sync();}p14apply();break;
    case 'p14off':cfg.p14last=cfg.p14;cfg.p14=null;lsSet('darts_cfg',cfg);break;
    case 'p14reset':if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Opravdu od dne 1?';return;}cfg.p14={id:Date.now(),day:1,done:[]};cfg.p14last=null;p14apply();break;
    case 'statsf':statsF=t.dataset.v;break;
    case 'p14day':cfg.p14.day=+t.dataset.v;p14apply();break;
    case 'p14how':cfg.p14.how=!cfg.p14.how;lsSet('darts_cfg',cfg);break;
    case 'axhit':addFb('x',true);return;
    case 'axmiss':addFb('x',false);return;
    case 'ayhit':addFb('y',true);return;
    case 'aymiss':addFb('y',false);return;
    case 'rdraw':drawSet();return;
    case 'rhit':addRand(true);return;
    case 'rmiss':addRand(false);return;
    case 'cok':addC(+t.dataset.d,true);return;
    case 'cfail':addC(run.cd||9,false);return;
    case 'thit':addT(true);return;
    case 'tmiss':addT(false);return;
    case 'tnext':run.tfresh=true;run.tsel=null;run.tcol=null;if(run.tauto)run.tt=randDbl(run.tt);saveDraft();break;
    case 'trand':run.tt=randDbl(run.tt);saveDraft();break;
    case 'tauto':run.tauto=!run.tauto;if(run.tauto){const c=replay(run.darts).t.cur;if(!(c&&c.n>0&&c.n<c.N))run.tt=randDbl(run.tt);}saveDraft();break;
    case 'resume':startRun(draftPending);run.running=false;run.paused=false;run.lastIn=Date.now();saveDraft();break;
    case 'hold':run.paused=true;run.pausedAt=Date.now();saveDraft();break;
    case 'unhold':run.paused=false;run.pausedAt=0;run.lastIn=Date.now();saveDraft();break;
    case 'discard-draft':lsDel(LS_D);draftPending=null;break;
    case 'pause':run.running=!run.running;run.last=performance.now();break;
    case 'goto':run.phase=+t.dataset.i;run.phaseStart=run.elapsed;saveDraft();break;
    case 'next':if(run.phase<run.plan.length-1){run.phase++;run.phaseStart=run.elapsed;saveDraft();}break;
    case 'bob':addBob(+t.dataset.n);return;
    case 'ohit':addO(true);return;
    case 'omiss':addO(false);return;
    case 'onew':commit(ocode()+':0:0');return;
    case 'bobnew':commit(kcode()+':0:0');return;
    case 'hit':addDart(true);return;
    case 'miss':addDart(false);return;
    case 'undo':{const g=run.groups&&run.groups.pop();const rm=run.darts.splice(-(g||1));if(rm.length){const q=rm[0].split(':');if(q[0]==='z')run.zcur=+q[1];if(q[0]==='p')run.pcur=+q[1];}saveDraft();break;}
    case 'tag':tagLast(t.dataset.v);break;
    case 'mpos':{const m=t.getScreenCTM();if(!m)return;const pt=t.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(m.inverse());tagPos(q.x,q.y);break;}
    case 'mclr':tagClr();break;
    case 'phit':addP(true);return;
    case 'pmiss':addP(false);return;
    case 'zok':addZ(+t.dataset.d,true);return;
    case 'zfail':addZ(9,false);return;
    case 'dhit':dartInput(true,+t.dataset.c);return;
    case 'dmiss':dartInput(false,+t.dataset.c);return;
    case 'vhit':visitInput(+t.dataset.k);return;
    case 'vmiss':visitInput(0);return;
    case 'fc':run.fc=t.dataset.v;saveDraft();break;
    case 'finish':await finish();return;
    case 'abort':if(!run.darts.length||t.dataset.sure){run=null;lsDel(LS_D);}else{t.dataset.sure='1';t.textContent='Opravdu zahodit?';return;}break;
    case 'del':confirmDel=t.dataset.id;break;
    case 'del-no':confirmDel=null;break;
    case 'del-yes':try{await Store.remove(t.dataset.id);}catch(err){flash('Smazání se nepodařilo.');}confirmDel=null;break;
    case 'export':exportText=JSON.stringify(allSessions().map(x=>x.s),null,1);try{await navigator.clipboard.writeText(exportText);flash('Zkopírováno do schránky.');}catch(err){}break;
  }
  render();
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.omode!==undefined){cfg.omode=t.value;lsSet('darts_cfg',cfg);render();}
  if(t.dataset&&t.dataset.bneg!==undefined){cfg.bneg=t.value==='1';lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.fav!==undefined){cfg.fav=t.value;lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.zr!==undefined){cfg.zr=t.value;lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.tn!==undefined){cfg.tn=+t.value;lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.lim!==undefined){cfg.lim[t.dataset.lim]=+t.value;lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.fb!==undefined){cfg.fb=t.value;lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.timed!==undefined){cfg.timed=t.checked;lsSet('darts_cfg',cfg);render();}
  else if(t.dataset&&t.dataset.cfg){const set=new Set(cfg.sel);if(t.checked)set.add(t.dataset.cfg);else set.delete(t.dataset.cfg);cfg.sel=PHASEDEF.map(p=>p.id).filter(i=>set.has(i));lsSet('darts_cfg',cfg);render();}
  else if(t.id==='tsel'&&run){run.tt=+t.value;saveDraft();render();}
});
document.getElementById('praise').addEventListener('click',()=>$('#praise').classList.remove('show'));
{const v=document.getElementById('ver');if(v)v.textContent=BUILD;const bb=document.getElementById('bboard');if(bb)bb.innerHTML=BOARD_SVG;}
(async function init(){
  const d=lsGet(LS_D,null);if(d&&d.darts)draftPending=d;
  render();
  await Store.init();
  render();
  await Cloud.init();
})();
</script>
